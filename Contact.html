
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | My Website</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">MySite</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="content-box">
      <h1>Get in Touch</h1>
      <p>Send a quick message using the form below.</p>
      <form id="contactForm" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />

        <label for="notes">Message</label>
        <textarea id="notes" rows="4" required placeholder="Write your message..."></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
      <p id="formFeedback" class="status-msg"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MySite. Hosted on GitHub Pages.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
